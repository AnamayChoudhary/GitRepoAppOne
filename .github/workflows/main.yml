name: Auto Review Open PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review-prs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Get PR Diff
        id: pr
        run: |
          gh pr diff ${{ github.event.pull_request.number }} > pr_diff.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Call OpenAI for Review
        id: ai-review
        run: |
          payload=$(jq -n \
          --arg diff "$(cat pr_diff.txt)" \
          '{
            "model": "sonar",
            "messages": [
              {"role": "system", "content": "ou are a senior code reviewer. Review the following PR diff and provide feedback as bullet points. Each bullet must reference the relevant line(s) of code in this format: Line X: [feedback]. Each bullet must be concise (max 20 words). Focus on: Bugs or logic errors, Code style and readability, Security or performance issues, Suggestions for improvement. Only include actionable, high-impact feedback."},
              {"role": "user", "content": $diff}
            ]
          }')

          response=$(curl -s https://api.perplexity.ai/chat/completions \
            -H "Authorization: Bearer ${{ secrets.PPLX_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "$payload")

          echo "=== Full Perplexity Response ==="
          echo "$response"

          review=$(echo "$response" | jq -r '.choices[0].message.content')
          echo "=== Review ==="
          echo "$review"
          
          echo "$review" > review.txt
          echo "review<<EOF" >> $GITHUB_ENV
          cat review.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Post Review Comment
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body "$review"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          review: ${{ env.review }}
